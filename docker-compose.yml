services:
  project-goblin:
    build: .
    container_name: project-goblin
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Docker socket access — required for container monitoring
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
